<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webshop göffel.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <a href="/" class="logo">webshop göffel.</a>
    <a href="cart.html" class="cart">Warenkorb (<span id="cart-counter">0</span>)</a>
  </header>

  <main class="hero">
    <p class="hero-label">Neu im Shop</p>
    <h1>Design, das bleibt.</h1>
    <p class="hero-text">Entdecke unsere neue Kollektion</p>
  </main>

  <section class="products-section">
    <h1>Products</h1>
    <div id="products" class="product-grid">Loading...</div>
  </section>

  <script src="cart.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api/products';

    async function loadProducts() {
      const container = document.getElementById('products');
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const products = await res.json();

        container.innerHTML = '';
        for (const p of products) {
          const card = document.createElement('a');
          card.className = 'product';
          card.href = 'product.html?id=' + p.id;

          const wrap = document.createElement('div');
          wrap.className = 'product-img-wrap';
          const img = document.createElement('img');
          img.src = p.image_url;
          img.alt = p.name;
          img.loading = 'lazy';
          img.onerror = () => { img.style.visibility = 'hidden'; };
          wrap.append(img);

          const info = document.createElement('div');
          info.className = 'product-info';
          const name = document.createElement('h3');
          name.textContent = p.name;
          const price = document.createElement('span');
          price.className = 'price';
          price.textContent = formatPrice(p.price);
          info.append(name, price);

          card.append(wrap, info);
          container.append(card);
        }
      } catch (err) {
        container.textContent = 'Could not load products: ' + err.message;
      }
    }

    loadProducts();
  </script>
</body>
</html>
