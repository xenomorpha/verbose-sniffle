<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webshop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<script>
  const API_URL = 'http://localhost:3000/api/products';
  const CART_KEY = 'cart';

function getCart() {
  try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
  catch { return []; }
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function cartCount() {
  return getCart().reduce((sum, item) => sum + item.qty, 0);
}

// #32: header counter
function updateCartCounter() {
  document.querySelector('.cart').textContent = 'Warenkorb (' + cartCount() + ')';
}

function addToCart(product) {
  const cart = getCart();
  const existing = cart.find(item => item.id === product.id);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ id: product.id, name: product.name, price: Number(product.price), qty: 1 });
  }
  saveCart(cart);
  updateCartCounter();   // updates immediately, no reload
}

  async function loadProducts2() {
    const container = document.getElementById('products');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const products = await res.json();

      container.innerHTML = '';
      for (const p of products) {
        const card = document.createElement('div');
        card.className = 'product';

        const img = document.createElement('img');
        img.src = p.image_url;
        img.alt = p.name;
        img.onerror = () => img.remove();   // hide broken images for now

        const name = document.createElement('h3');
        name.textContent = p.name;

        const desc = document.createElement('p');
        desc.textContent = p.description;

        const price = document.createElement('strong');
        price.textContent = 'CHF ' + Number(p.price).toFixed(2);

        const btn = document.createElement('button');
        btn.textContent = 'In den Warenkorb';
        btn.className = 'add-to-cart';
        btn.addEventListener('click', () => addToCart(p));
        card.append(img, name, desc, price, btn);
        container.append(card);
      }
    } catch (err) {
      container.textContent = 'Could not load products: ' + err.message;
    }
    
  }

document.addEventListener('DOMContentLoaded', loadProducts2);
updateCartCounter();

</script>
<script src="cart.js"></script>
<body>

  <header class="header">
    <a href="/" class="logo">webshop.</a>
    <button class="cart">Warenkorb (0)</button>
  </header>

  <main class="hero">
    <p class="hero-label">Neu im Shop</p>
    <h1>Design, das bleibt.</h1>
    <p class="hero-text">Entdecke unsere neue Kollektion</p>
  </main>
  <section class="products-section">
  <h1>Products</h1>
  <div id="products">Loading...</div>
</section>
</body>
</html>
